[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mood-to-master"
version = "0.1.0"
description = "Maps generator moods and tags onto Master Node category, preset IDs, and socket deltas. Output is a value map MCP can set_param."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Plygonality" }]
keywords = ["blender", "materials", "look-dev", "tech-art", "sci-fi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.6"]

[project.scripts]
mood-to-master = "mood_to_master.cli:main"

[project.urls]
Homepage = "https://github.com/Plygonality/Mood-to-Master"
Generator = "https://github.com/Plygonality/Hard-SciFi-idea-generator"
Master-Node = "https://github.com/Plygonality/Master-Node"
Plygon-mcp = "https://github.com/Plygonality/Plygon-mcp"

[tool.setuptools.packages.find]
include = ["mood_to_master", "mood_to_master.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["mood_to_master", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
